# Кусок для server {} текущего сайта фронтенда.
# Тот же домен -> CORS не нужен вообще.
# client_max_body_size должен совпадать с MAX_UPLOAD_MB из .env бэкенда.

location /api/ {
    client_max_body_size 300m;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # POST /api/jobs лёгкий (квитанция сразу) — больших таймаутов не нужно
    proxy_read_timeout 60s;
}
